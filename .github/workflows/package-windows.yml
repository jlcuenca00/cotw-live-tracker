name: package-windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-radar-redesign
    paths:
      - "src/**"
      - "offsets/**"
      - "data/**"
      - "RELEASE_README.txt"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/package-windows.yml"

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Self-test
        shell: pwsh
        run: |
          dotnet restore src/CotwLiveTracker/CotwLiveTracker.csproj
          dotnet run --project src/CotwLiveTracker/CotwLiveTracker.csproj -c Release -- --selftest

      - name: Publish WildTrace
        shell: pwsh
        run: |
          dotnet publish src/CotwLiveTracker.Desktop/CotwLiveTracker.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -o publish

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/WildTrace-v0.16.0-beta.2 | Out-Null
          Copy-Item publish/WildTrace.exe release/WildTrace-v0.16.0-beta.2/
          Copy-Item publish/offsets release/WildTrace-v0.16.0-beta.2/offsets -Recurse
          Copy-Item publish/data release/WildTrace-v0.16.0-beta.2/data -Recurse
          Copy-Item RELEASE_README.txt release/WildTrace-v0.16.0-beta.2/
          Copy-Item README.md release/WildTrace-v0.16.0-beta.2/
          Copy-Item THIRD_PARTY_NOTICES.md release/WildTrace-v0.16.0-beta.2/

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/WildTrace-v0.16.0-beta.2 `
            -DestinationPath release/WildTrace-v0.16.0-beta.2-win-x64.zip `
            -CompressionLevel Optimal

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WildTrace-v0.16.0-beta.2-win-x64
          path: release/WildTrace-v0.16.0-beta.2-win-x64.zip
          if-no-files-found: error
          retention-days: 30
