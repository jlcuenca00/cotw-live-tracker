name: build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore console
        run: dotnet restore src/CotwLiveTracker/CotwLiveTracker.csproj

      - name: Restore desktop
        run: dotnet restore src/CotwLiveTracker.Desktop/CotwLiveTracker.Desktop.csproj

      - name: Build console
        run: dotnet build src/CotwLiveTracker/CotwLiveTracker.csproj --configuration Release --no-restore

      - name: Build desktop
        run: dotnet build src/CotwLiveTracker.Desktop/CotwLiveTracker.Desktop.csproj --configuration Release --no-restore

      - name: Self-test
        run: dotnet run --project src/CotwLiveTracker/CotwLiveTracker.csproj --configuration Release --no-build -- --selftest
